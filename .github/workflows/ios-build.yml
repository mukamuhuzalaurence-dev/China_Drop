name: Build iOS App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Dist
        run: npm run build

      - name: Install Capacitor CLI
        run: npm install @capacitor/core @capacitor/ios @capacitor/cli

      - name: Add & Sync iOS Project
        run: |
          npx cap init "China Drop" "com.chinadrop.rwanda" --web-dir dist
          npx cap add ios
          npx cap copy ios

      - name: Build Xcode Workspace
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: china-drop-ios-archive
          path: ios/App/App.xcarchive
