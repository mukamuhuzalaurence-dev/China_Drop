name: Build & Deploy China Drop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ── 1. DEPLOY WEB APP TO GH-PAGES BRANCH ─────────────────────────
  deploy-web:
    name: 🍎 iPhone Web App & Live Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true

      - name: Upload Web Zip Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-iPhone-WebApp
          path: dist/

  # ── 2. BUILD ANDROID APK ─────────────────────────────────────────
  build-android:
    name: 🤖 Android APK Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync → Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
