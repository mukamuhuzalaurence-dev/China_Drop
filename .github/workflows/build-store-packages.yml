name: Build & Deploy China Drop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  # ── 1. BUILD WEB APP & DEPLOY TO GITHUB PAGES ────────────────────
  deploy-pwa:
    name: 🍎 iPhone Web App & Live Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Web App Bundle
        run: npm run build

      - name: Upload Web Dist Artifact (Downloadable Zip)
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-iPhone-WebApp-Dist
          path: dist/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── 2. ANDROID DEBUG APK ─────────────────────────────────────────
  build-android:
    name: 🤖 Android APK Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync → Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-Android-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
