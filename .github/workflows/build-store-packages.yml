name: Build & Deploy China Drop

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── 1. BUILD WEB + ANDROID DEBUG APK ────────────────────────────
  build-android:
    name: 🤖 Android APK (Debug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm install

      - name: Build web assets
        run: npm run build

      - name: Capacitor sync → Android
        run: npx cap sync android

      - name: Build Android debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ── 2. DEPLOY AS INSTALLABLE PWA TO GITHUB PAGES (WORKS ON IPHONE!) ──
  deploy-pwa:
    name: 🍎 Deploy PWA → iPhone installable
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install JS dependencies
        run: npm install

      - name: Build production bundle
        run: npm run build
        env:
          GITHUB_PAGES: 'true'

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
