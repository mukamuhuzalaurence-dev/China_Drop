name: Build App Store & Play Store Packages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ── 1. GOOGLE PLAY STORE (ANDROID APK) ──────────────────────
  build-android:
    name: 🤖 Build Android Play Store (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync Android
        run: npx cap sync android

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # ── 2. APPLE APP STORE (iOS XCODE ARCHIVE) ─────────────────
  build-ios:
    name: 🍎 Build iOS App Store (.ipa)
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Assets
        run: npm run build

      - name: Capacitor Sync iOS
        run: npx cap sync ios

      - name: Build Xcode Project
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -archivePath App.xcarchive archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Upload iOS App Archive
        uses: actions/upload-artifact@v4
        with:
          name: ChinaDrop-iOS-AppStore
          path: ios/App/App.xcarchive
